spring:
  application:
    name: schedule
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:dacn_db}
    username: ${DB_USERNAME:user_admin}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration