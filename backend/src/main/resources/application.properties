spring.application.name=schedule

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:dacn_db}
spring.datasource.username=${DB_USERNAME:user_admin}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

# ===== Ứng dụng =====
# Phiên bản lấy từ pom.xml khi build bằng Maven (hiện nguyên chuỗi nếu chạy ngoài Maven)
app.version=@project.version@
# Múi giờ dùng cho timestamp trả về trong API (dữ liệu trong DB vẫn lưu UTC)
app.timezone=Asia/Ho_Chi_Minh
# Các nguồn (origin) được phép gọi API từ trình duyệt, ngăn cách bằng dấu phẩy
app.cors.allowed-origins=http://localhost:5173

# ===== Swagger / OpenAPI (springdoc) =====
# Giao diện: http://localhost:8080/swagger-ui.html   Tài liệu JSON: http://localhost:8080/v3/api-docs
# Khi triển khai thật, tắt bằng biến môi trường SPRINGDOC_API_DOCS_ENABLED=false và SPRINGDOC_SWAGGER_UI_ENABLED=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json
# Tự chạy docker compose khi khởi động ứng dụng và để DB chạy tiếp khi tắt ứng dụng
spring.docker.compose.file=../docker-compose.yml
spring.docker.compose.lifecycle-management=start-only