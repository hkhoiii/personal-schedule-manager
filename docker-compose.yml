services:
  postgres:
    image: postgres:17
    container_name: psm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dacn_db}
      POSTGRES_USER: ${DB_USERNAME:-user_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: